name: call-max
run-name: max ${{ inputs.label }} in ${{ inputs.group }}
on:
  workflow_dispatch:
    inputs:
      label: {type: string, required: true}
      group: {type: string, required: true}
jobs:
  call:
    uses: ./.github/workflows/lock-max.yml
    with:
      label: ${{ inputs.label }}
      group: ${{ inputs.group }}
